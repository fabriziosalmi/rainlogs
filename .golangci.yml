version: "2"
run:
  go: "1.25"
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - exhaustive
    - gochecknoinits
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
        - unnamedResult
        - tooManyResultsChecker
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G115
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          severity: warning
        - name: unused-parameter
          severity: warning
        - name: var-naming
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - gocritic
          - godot
          - gosec
        path: migrations/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/fabriziosalmi/rainlogs
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
